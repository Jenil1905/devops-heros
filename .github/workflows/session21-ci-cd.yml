name: TaskBoard Python CI/CD

on:
  push:
    paths:
      - 'session21-python/**'
      - '.github/workflows/session21-ci-cd.yml'
    branches: [main, task]
  pull_request:
    branches: [main, task]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: session21-python/backend
      - name: Run backend tests
        run: pytest -v
        working-directory: session21-python/backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        run: npm install && npm run build
        working-directory: session21-python/frontend

  build-scan-push:
    name: Build, Scan & Push Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend & frontend images
        run: |
          docker build -t ghcr.io/${{ env.OWNER_LC }}/taskboard-backend:${{ github.sha }} ./session21-python/backend
          docker build -t ghcr.io/${{ env.OWNER_LC }}/taskboard-frontend:${{ github.sha }} ./session21-python/frontend

      - name: Security Scan Backend with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Security Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Push images to GitHub Container Registry
        run: |
          docker push ghcr.io/${{ env.OWNER_LC }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.OWNER_LC }}/taskboard-frontend:${{ github.sha }}
